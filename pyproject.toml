[project]
name = "nexus-vps"
version = "1.0.0"
description = "Private control panel for a Linux host"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "websockets>=14,<17",
  "pydantic>=2.11,<3", "pydantic-settings>=2.9,<3", "sqlalchemy>=2.0.40,<2.1",
  "alembic>=1.15,<2", "argon2-cffi>=23.1,<26",
  "psutil>=6.1,<8",
]

[project.optional-dependencies]
docker = ["docker>=7.1,<8"]
dev = ["pytest>=8,<10", "httpx2>=2.16.2,<3", "ruff>=0.11,<1", "docker>=7.1,<8"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
